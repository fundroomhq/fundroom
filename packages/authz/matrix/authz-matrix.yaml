# Authorization matrix.
#
# The single source for two things:
#   permissions: which staff roles hold each `<module>.<verb>` permission (RBAC layer 2).
#                External kinds (investor, delegate) never hold a permission: everything they
#                see comes from grants (layer 3) and gates (layer 4).
#   routes:      what every `/api/v1` route requires. `requires` vocabulary:
#                  public            no session needed (anti-enumeration start endpoints, landing pages)
#                  session           any signed-in user, member or not
#                  member            a live membership in the resolved workspace
#                  <permission>      a live *staff* membership holding the permission
#                  owner-or-admin    staff owner/admin anywhere (setup probes; no workspace context)
#                  platform-operator the operator cookie session of a live platform operator on the
#                                    canonical host; no membership involved, 404 otherwise
#                `stepUp: true` adds the 10-minute freshness check.
#                `apiKey: true` lets a workspace API key call the route; only on a
#                <permission> row without `stepUp`. `x-requires` then reads `<permission>+apikey`.
#
# `scripts/render-authz-matrix.mjs` renders docs/authz-matrix.md from this file;
# `packages/authz/src/matrix.test.ts` checks the RBAC table against it, and
# `apps/server/src/authz-matrix.test.ts` checks every OpenAPI route's `x-requires` against it.
# Adding a route without a row here, or a permission without an entry, fails CI.
version: 1

roles:
  staff: [owner, admin, editor, viewer, finance, legal]
  external: [investor, delegate]

permissions:
  access.read:
    roles: [owner, admin, legal]
    description: People, groups, invitations, "who has access" and explain.
  access.manage:
    roles: [owner, admin]
    description: Invite and revoke external members, manage groups, grants and policies.
  access.manage_staff:
    roles: [owner, admin]
    description: Invite, re-role and revoke staff. Admins may not touch owners (enforced in the handler).
  access.transfer:
    roles: [owner]
    description: Transfer ownership, revoke an owner.
  access.settings:
    roles: [owner, admin]
    description: Workspace access settings (MFA requirements, invite expiry).
  # E2.7 danger zone. Owner only, like `access.transfer`, and narrower than anything else here:
  # deleting the workspace starts a 30-day clock that ends in crypto-shredding every document
  # key, so it is the one decision that cannot be undone by anybody once the clock runs out.
  # The route also demands step-up and the workspace slug typed back.
  access.delete_workspace:
    roles: [owner]
    description: Delete the workspace (soft delete, purged after 30 days unless restored by an operator).
  # offering mode + legal documents. `legal` is the role counsel-facing staff get, so it
  # reads and manages the texts; changing the offering status is an owner/admin decision because
  # it is the company's own reliance on an exemption, not a document-management task.
  compliance.read:
    roles: [owner, admin, legal]
    description: Offering mode and its history, the template library, legal documents and versions, the acceptance register, legal settings.
  compliance.manage:
    roles: [owner, admin, legal]
    description: Create, edit, publish and remove legal documents, and change the workspace's legal settings.
  compliance.offering:
    roles: [owner, admin]
    description: Change the offering status. Switching to 506(c) is irrevocable and needs an explicit confirmation.
  # branding. Owner/admin only: the brand is the company's identity to every investor
  # who opens the portal or an email, not a document-management task, so the `legal` and
  # `editor` roles that manage texts and pages do not get to repaint the portal.
  branding.read:
    roles: [owner, admin]
    description: The workspace brand, its derived theme tokens and the contrast report.
  branding.manage:
    roles: [owner, admin]
    description: Change the brand, upload or import the logo, remove it.
  # custom domains. Owner/admin only, on branding's reasoning and a sharper edge: the
  # hostname the portal answers on decides where every investor's session cookie lives and where
  # every emailed link points, so it is an ownership decision, not a content one. Mutations also
  # need step-up: a stolen session that could
  # repoint a portal would be a phishing primitive.
  domains.read:
    roles: [owner, admin]
    description: The workspace's custom portal domains, the DNS records to publish and the last resolver answer.
  domains.manage:
    roles: [owner, admin]
    description: Add a custom portal domain, re-check its DNS, remove it.
  # embed. Owner/admin only, on the same reasoning as domains and the same sharper edge:
  # the origin allow-list becomes `frame-ancestors`, so it decides which sites may wrap the
  # portal in their own chrome, and the handoff keys decide whose server may assert who an
  # investor is. Mutations need step-up (as E2.1 followed for custom domains): a
  # stolen session that could add an origin would be a clickjacking and phishing primitive.
  embed.read:
    roles: [owner, admin]
    description: The embed settings, the derived frame-ancestors list and the snippet URLs.
  embed.manage:
    roles: [owner, admin]
    description: Change the embed origin allow-list, the builder-preview toggle, host-identity trust and the handoff keys.
  # share links & NDA. Owner/admin/legal read, owner/admin manage — the same split
  # `compliance.*` uses and for the same reason: a share link is a decision about who may see the
  # room and on what terms, which counsel reviews and the founders make. `editor` publishes
  # material; it does not decide who is let in. Minting and revoking need step-up,
  # because a link is a standing invitation to a data room and a stolen session that could mint
  # one would be an exfiltration primitive.
  share-links.read:
    roles: [owner, admin, legal]
    description: The workspace's share links, their policies and caps, and who came in through each one.
  share-links.manage:
    roles: [owner, admin]
    description: Mint, pause, resume and revoke share links, and choose whether revoking also cuts off the memberships a link created.
  # audit log. Read is owner/admin/legal — the roles that already read "who has access"
  # (`access.read`) and the acceptance register (`compliance.read`), because the log is the
  # history of exactly those facts. Export is owner/legal only and needs step-up: a signed,
  # portable copy of the whole trail is what a regulator or a court asks for, it carries every
  # member's IP and user agent, and an admin who could export it could also be its subject.
  audit.read:
    roles: [owner, admin, legal]
    description: Search and read the workspace audit log, verify its hash chain, read the export signing keys.
  audit.export:
    roles: [owner, legal]
    description: Download a signed export of the audit log for a time range.
  # jobs, dead letters and health. Owner/admin: the page is operational plumbing, not
  # content, and a retried dead letter re-runs a side effect (an email, a webhook) on the
  # workspace's behalf. Discarding one needs step-up because it is the last copy of that work.
  ops.read:
    roles: [owner, admin]
    description: The workspace's dead letters, instance queue stats, health checks and update status (single-tenant mode), custom-domain certificate status.
  ops.manage:
    roles: [owner, admin]
    description: Retry or discard the workspace's dead-lettered jobs.
  # workspace export. Owner only, like `access.transfer` and `access.delete_workspace`: an
  # export is the whole company's data — every document, every investor's contact details and
  # engagement, the audit trail — leaving the instance in one file, which is narrower than the
  # audit export `legal` may take. Starting and downloading an export also need step-up.
  portability.export:
    roles: [owner]
    description: Export the whole workspace (tables, files and audit trail) as a signed zip, download and delete exports.
  # API keys and outbound webhooks. Owner/admin: a key is a standing credential
  # that acts as its creator, and a webhook endpoint sends the workspace's events to a URL outside
  # the instance — both are integration decisions of the same weight as the embed origin list.
  # Minting, rotating and revoking a key, and creating, deleting and re-pointing an endpoint, need
  # step-up. A key itself can never call these routes (keys cannot see or mint keys).
  api-keys.read:
    roles: [owner, admin]
    description: The workspace's API keys (never their tokens), their scopes, expiry and last use.
  api-keys.manage:
    roles: [owner, admin]
    description: Create, rename, rotate and revoke API keys.
  webhooks.read:
    roles: [owner, admin]
    description: The workspace's webhook endpoints (never their URLs or secrets), the topics on offer, and the delivery log with payloads.
  webhooks.manage:
    roles: [owner, admin]
    description: Add, change, test, re-key and remove webhook endpoints, and redeliver deliveries.
  # e-signature. `legal` reads the envelope register and downloads signed copies
  # (counsel-facing, like compliance.read); connecting a vendor, rotating its callback secret,
  # voiding an envelope and disconnecting are owner/admin integration decisions, the last three
  # (and saving a connection) with step-up.
  esign.read:
    roles: [owner, admin, legal]
    description: The e-sign vendor connection (never its credentials), the drivers on offer, and the envelope register with signed copies.
  esign.manage:
    roles: [owner, admin]
    description: Connect, verify, re-key and disconnect the e-sign vendor, and void or resync envelopes.
  # integrations hub. `finance` reads the connections because the KPI sources
  # (QuickBooks, Xero, Stripe) are its numbers; connecting, choosing an account, re-keying and
  # disconnecting hand vendor credentials to the server and stay owner/admin (the credential-
  # bearing ones with step-up). Booking links are portal content an admin curates.
  integrations.read:
    roles: [owner, admin, finance]
    description: Connected integrations (never their credentials), the providers on offer, booking links and the recorded bookings register.
  integrations.manage:
    roles: [owner, admin]
    description: Connect, verify, choose the account of, re-key and disconnect integrations, and manage booking links.
  # accreditation vendors. `legal` reads the connection (the 506(c) verification
  # provider is counsel's concern, like esign.read); connecting, re-verifying and disconnecting hand
  # vendor credentials to the server and stay owner/admin, all three with step-up.
  accreditation.read:
    roles: [owner, admin, legal]
    description: The accreditation vendor connection (never its credentials) and the vendors on offer.
  accreditation.manage:
    roles: [owner, admin]
    description: Connect, re-verify and disconnect the accreditation vendor.
  # AI assist. Every staff role that reads updates sees whether AI is available
  # and reads its own suggestions (a request is only ever readable by the member who started it,
  # while they still hold the task's permission). Turning AI on, choosing features and the budget,
  # and acknowledging the model provider (documents may leave the host) is owner/admin + step-up.
  ai.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: AI assist availability, the workspace's AI settings and usage, and one's own AI suggestions.
  ai.manage:
    roles: [owner, admin]
    description: Turn AI assist and its features on or off, set the token budget, acknowledge the model provider.
  # staff SSO + SCIM. The connection decides who can sign in as staff, a verified
  # domain lets the IdP link and provision accounts, and a SCIM token can create, suspend and
  # re-role staff. Admins read; only the owner changes any of it — an admin who could point the
  # workspace at an IdP they control could sign in as the owner. Every write that changes who gets
  # in is step-up.
  sso.read:
    roles: [owner, admin]
    description: The workspace's SSO connection, verified domains and SCIM provisioning (never secrets or tokens).
  sso.manage:
    roles: [owner]
    description: Configure, test, enable, enforce and delete the SSO connection; add, verify and remove domains; mint and revoke SCIM tokens; map SCIM groups to roles.
  # billing (only meaningful with CONTROL_PLANE=on and a BILLING_DRIVER). Reading
  # the plan, subscription and usage is for the people who pay or run the workspace; starting a
  # checkout or opening the provider's portal commits the company to a price and hands over its
  # payment details, so it is the owner's alone, with step-up.
  billing.read:
    roles: [owner, admin, finance]
    description: The workspace's plan, subscription status, grace period and usage against the plan's limits.
  billing.manage:
    roles: [owner]
    description: Start a checkout for a plan and open the billing provider's customer portal.

  content.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: Read pages, drafts, revisions and the block registry; preview as an audience.
  content.manage:
    roles: [owner, admin, editor]
    description: Create pages, edit drafts, set section visibility, restore revisions, delete custom pages.
  content.publish:
    roles: [owner, admin, editor]
    description: Publish a draft as a new revision.
  content.settings:
    roles: [owner, admin]
    description: Content settings (allow public sections).
  data-room.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: Browse the whole tree, open any document, list versions and templates.
  data-room.manage:
    roles: [owner, admin, editor]
    description: Create/move/delete folders and documents, upload, change protection, recycle bin.
  data-room.download:
    roles: [owner, admin, editor, finance, legal]
    description: Download the original file (investors only ever get a watermarked copy).
  data-room.legal_hold:
    roles: [owner, admin, legal]
    description: Set or clear a legal hold on a document.
  data-room.settings:
    roles: [owner, admin]
    description: Data room settings (defaults, unscanned policy, recycle bin retention).
  # forensic watermark detection. Owner/admin/legal — the audience of
  # `data-room.legal_hold` and `audit.read`: tracing a leak names a recipient, which is an
  # investigation, not content work. Running a detection also needs step-up.
  data-room.forensics:
    roles: [owner, admin, legal]
    description: Trace a leaked page image to its recipient (forensic watermark detection) and list who was served a forensically marked version.
  # data-room Q&A. Reading the staff inbox is `data-room.read`; these three split the
  # work: the expert drafts, the coordinator routes and releases, the approver signs off
  # (four-eyes when the workspace requires approval — never on an answer they wrote).
  data-room.qa_answer:
    roles: [owner, admin, editor, finance, legal]
    description: Q&A expert — write, edit and submit a draft answer to a data-room question.
  data-room.qa_manage:
    roles: [owner, admin]
    description: Q&A coordinator — assign, set due dates, release/publish/unpublish, close/reopen, edit public text, CSV import/export.
  data-room.qa_approve:
    roles: [owner, admin, legal]
    description: Q&A approver — approve or reject a submitted answer.
  updates.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: List updates, read drafts, sends, recipient status and every reply thread.
  updates.manage:
    roles: [owner, admin, editor]
    description: Create and edit drafts, set audiences and section rules, archive, delete.
  updates.send:
    roles: [owner, admin, editor]
    description: Test send, schedule, send now, publish to the archive.
  updates.settings:
    roles: [owner, admin]
    description: Update email settings (sender, reply-to, footer) and the sending domain.

  # KPIs. `metrics.read` is every staff role, like `updates.read` and `analytics.read`:
  # the numbers a company publishes to its investors are the numbers its own staff work from,
  # and a viewer who cannot see them cannot check an update before it goes out. `manage` adds
  # `finance` to the editor set, because entering the month's figures is a finance task rather
  # than an editorial one. `settings` is owner/admin/finance: connecting a Google Sheet hands a
  # service-account credential to the server and decides which spreadsheet the published
  # numbers come from, which is the same class of decision as the sending domain.
  metrics.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: Metric definitions, the period grid, restatement history and CSV import results.
  metrics.manage:
    roles: [owner, admin, editor, finance]
    description: Define and remove metrics, save the grid, restate a point, run a CSV import, pull the sheet now.
  metrics.settings:
    roles: [owner, admin, finance]
    description: Metric defaults (reporting currency, period) and the Google Sheets connection.

  # round, interest and commitments. `round.read` matches `metrics.read` — every staff
  # role, because the numbers and the terms a company is raising on are what its own staff work
  # from, and `legal`/`finance` are precisely the roles asked to check them. `manage` adds
  # `finance` and `legal` to the editor set: deciding an interest submission is a finance
  # judgement and settling an accreditation verification is a legal one, and neither is an
  # editorial task. `publish` is owner/admin alone and step-up throughout, because opening a
  # round, closing it and exporting the commitment list are the company's own securities
  # decisions — the same class as changing the offering status.
  round.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: Rounds, terms, interest submissions, verifications and allocation.
  round.manage:
    roles: [owner, admin, editor, finance, legal]
    description: Edit rounds and terms, decide interest submissions and verifications, manage commitments.
  round.publish:
    roles: [owner, admin]
    description: Open and close a round, export commitments.
  round.settings:
    roles: [owner, admin]
    description: Round module settings (evidence retention, default currency).

  # CRM-lite. No `finance` or `legal`: the pipeline is the fundraising team's working
  # notes about people, and the roles that exist to check figures and texts have no reason to
  # read a founder's private assessment of an investor. `viewer` reads and cannot write, which
  # is what the role means everywhere else.
  crm.read:
    roles: [owner, admin, editor, viewer]
    description: Contacts, organisations, pipeline, notes and tasks.
  crm.manage:
    roles: [owner, admin, editor]
    description: Create and edit CRM records and move pipeline items.

  # engagement analytics + notifications
  analytics.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: Engagement overview, who viewed a document, page dwell, a contact's timeline and the tracking settings.
  analytics.settings:
    roles: [owner, admin]
    description: Change the tracking mode and retention, and erase one member's engagement history (DSAR).
  notify.read:
    roles: [owner, admin, editor, viewer, finance, legal]
    description: Manage my own notification preferences and read my own notification inbox.
  # E2.6: workspace chat channels post into a room the whole team reads, so they are workspace
  # configuration (owner/admin), not a personal preference — and a webhook URL is a credential.
  notify.manage:
    roles: [owner, admin]
    description: Add, change, test and remove the workspace's Slack channels for notifications.

  # cap table (optional module). `legal` reads (counsel checks the ledger); importing and
  # publishing a snapshot is a finance task, publishing with step-up because investors see it.
  captable.read:
    roles: [owner, admin, finance, legal]
    description: Cap-table snapshots (drafts and published), their summary and holders.
  captable.manage:
    roles: [owner, admin, finance]
    description: Import, publish and delete cap-table snapshots, and the module's settings.
routes:
  # kernel
  - { method: GET, path: /modules, requires: public }
  - { method: GET, path: /me, requires: session }
  - { method: GET, path: "/invites/{token}", requires: public }
  # auth
  - { method: POST, path: /auth/otp/start, requires: public }
  - { method: POST, path: /auth/otp/verify, requires: public }
  - { method: POST, path: /auth/magic-link/start, requires: public }
  - { method: GET, path: /auth/magic-link/peek, requires: public }
  - { method: POST, path: /auth/magic-link/confirm, requires: public }
  - { method: POST, path: /auth/passkeys/login/begin, requires: public }
  - { method: POST, path: /auth/passkeys/login/finish, requires: public }
  - { method: POST, path: /auth/passkeys/step-up/finish, requires: session }
  # P2-01: every route below that adds, removes or replaces a sign-in factor also needs auth
  # level 2 once the user holds a second factor (TOTP or a passkey); enforced by the auth routes'
  # `requireFactorProof`, which the `requires` vocabulary cannot express (it depends on the user).
  - { method: POST, path: /auth/passkeys/register/begin, requires: session, stepUp: true }
  - { method: POST, path: /auth/passkeys/register/finish, requires: session }
  - { method: GET, path: /auth/passkeys, requires: session }
  - { method: PATCH, path: "/auth/passkeys/{id}", requires: session }
  - { method: DELETE, path: "/auth/passkeys/{id}", requires: session, stepUp: true }
  - { method: GET, path: /auth/totp, requires: session }
  - { method: DELETE, path: /auth/totp, requires: session, stepUp: true }
  - { method: POST, path: /auth/totp/enrol, requires: session, stepUp: true }
  - { method: POST, path: /auth/totp/enrol/confirm, requires: session }
  - { method: POST, path: /auth/totp/verify, requires: session }
  - { method: POST, path: /auth/totp/recovery, requires: session }
  - { method: POST, path: /auth/totp/recovery-codes, requires: session, stepUp: true }
  - { method: GET, path: /auth/password, requires: session }
  - { method: PUT, path: /auth/password, requires: session, stepUp: true }
  - { method: DELETE, path: /auth/password, requires: session, stepUp: true }
  - { method: POST, path: /auth/password/login, requires: public }
  - { method: POST, path: /auth/password/reverify, requires: session }
  - { method: GET, path: /auth/oidc/providers, requires: public }
  - { method: POST, path: /auth/oidc/begin, requires: public }
  - { method: GET, path: /auth/oidc/callback, requires: public }
  - { method: POST, path: /auth/logout, requires: session }
  # F-26 (ASVS 7.5.2): ending sessions other than the caller's own needs a fresh proof.
  # DELETE /me/sessions/{id} exempts the caller's current session (that is signing out).
  - { method: POST, path: /auth/logout-everywhere, requires: session, stepUp: true }
  - { method: POST, path: /auth/sessions/revoke-by-token, requires: public }
  - { method: GET, path: /me/sessions, requires: session }
  - { method: DELETE, path: "/me/sessions/{id}", requires: session, stepUp: true }
  - { method: GET, path: /me/devices, requires: session }
  - { method: PATCH, path: "/me/devices/{id}", requires: session }
  - { method: DELETE, path: "/me/devices/{id}", requires: session, stepUp: true }
  # first-run setup
  - { method: GET, path: /setup/status, requires: public }
  - { method: POST, path: /setup/token/verify, requires: public }
  - { method: POST, path: /setup/owner, requires: public }
  - { method: POST, path: /setup/probes/mail, requires: owner-or-admin }
  - { method: POST, path: /setup/probes/storage, requires: owner-or-admin }
  # access management
  - { method: GET, path: /access/people, requires: access.read, apiKey: true }
  - { method: GET, path: "/access/people/{id}", requires: access.read, apiKey: true }
  - { method: PATCH, path: "/access/people/{id}", requires: access.manage, stepUp: true }
  - { method: POST, path: "/access/people/{id}/revoke", requires: access.manage, stepUp: true }
  - { method: PUT, path: "/access/people/{id}/groups", requires: access.manage }
  - { method: GET, path: /access/invites, requires: access.read }
  - { method: POST, path: /access/invites, requires: access.manage }
  - { method: POST, path: "/access/invites/{id}/resend", requires: access.manage }
  - { method: DELETE, path: "/access/invites/{id}", requires: access.manage }
  - { method: POST, path: /access/invites/csv/dry-run, requires: access.manage }
  - { method: POST, path: /access/invites/csv/import, requires: access.manage }
  - { method: GET, path: "/access/invites/csv/imports/{id}", requires: access.read }
  - { method: GET, path: /access/groups, requires: access.read, apiKey: true }
  - { method: POST, path: /access/groups, requires: access.manage }
  - { method: GET, path: "/access/groups/{id}", requires: access.read }
  - { method: PATCH, path: "/access/groups/{id}", requires: access.manage }
  - { method: DELETE, path: "/access/groups/{id}", requires: access.manage, stepUp: true }
  - { method: POST, path: "/access/groups/{id}/members", requires: access.manage }
  - { method: DELETE, path: "/access/groups/{id}/members/{membershipId}", requires: access.manage }
  - { method: GET, path: /access/grants, requires: access.read }
  - { method: POST, path: /access/grants, requires: access.manage, stepUp: true }
  - { method: DELETE, path: "/access/grants/{id}", requires: access.manage, stepUp: true }
  - { method: GET, path: /access/policies, requires: access.read }
  - { method: POST, path: /access/policies, requires: access.manage, stepUp: true }
  - { method: DELETE, path: "/access/policies/{id}", requires: access.manage, stepUp: true }
  - { method: GET, path: "/access/resources/{kind}/{id}/who", requires: access.read }
  - { method: GET, path: "/access/resources/{kind}/{id}/explain", requires: access.read }
  - { method: GET, path: /access/settings, requires: access.read }
  - { method: PATCH, path: /access/settings, requires: access.settings, stepUp: true }
  - { method: GET, path: /access/my, requires: member }
  # delegates: the investor's own, and any investor's from the People screen
  - { method: GET, path: /access/my/delegates, requires: member }
  - { method: POST, path: /access/my/delegates, requires: member, stepUp: true }
  - { method: DELETE, path: "/access/my/delegates/{id}", requires: member, stepUp: true }
  - { method: GET, path: "/access/people/{id}/delegates", requires: access.read }
  - { method: POST, path: "/access/people/{id}/delegates", requires: access.manage, stepUp: true }
  - { method: DELETE, path: "/access/people/{id}/delegates/{delegateId}", requires: access.manage, stepUp: true }
  # access review, sessions admin, ownership and the danger zone
  - { method: GET, path: /access/review, requires: access.read }
  - { method: GET, path: /access/reviews, requires: access.read }
  - { method: POST, path: /access/reviews, requires: access.manage, stepUp: true }
  - { method: GET, path: "/access/reviews/{id}/report", requires: access.read }
  - { method: GET, path: "/access/people/{id}/sessions", requires: access.read }
  - { method: DELETE, path: "/access/people/{id}/sessions/{sessionId}", requires: access.manage, stepUp: true }
  - { method: POST, path: "/access/people/{id}/sessions/revoke", requires: access.manage, stepUp: true }
  - { method: POST, path: /access/ownership/transfer, requires: access.transfer, stepUp: true }
  - { method: POST, path: /access/sessions/revoke-all, requires: access.transfer, stepUp: true }
