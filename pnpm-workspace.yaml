packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"
  - "modules/*"
  - "e2e"
  # plugins/wordpress is PHP and is built by its own script, not pnpm.

# Supply chain: refuse to resolve a version published less
# than 7 days ago, so a hijacked release has a week to be noticed and yanked.
minimumReleaseAge: 10080

# Only packages that genuinely need postinstall scripts get to run them.
# Add to this list deliberately; everything else is blocked by pnpm 10.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - lefthook

# Optional native accelerators pulled in by testcontainers (ssh2). Pure-JS fallbacks work.
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2

# Security floors for transitive deps: the SAML stack under
# @node-saml/node-saml. xml-crypto >= 6.0.1 fixes the SignedInfo-reference and DigestValue-comment
# signature bypasses (CVE-2025-29774/29775) and 6.2+ publishes references only after the
# SignatureValue verifies; 6.3.2 (c14n namespace fix) is younger than minimumReleaseAge on
# 2026-09-27, so the floor is 6.3.0 until then. @xmldom/xmldom 0.8.15 carries the 2026-04 and
# 2026-08 advisory fixes; node-saml needs the 0.8 line.
overrides:
  xml-crypto: "^6.3.0"
  "@xmldom/xmldom": "^0.8.15"

