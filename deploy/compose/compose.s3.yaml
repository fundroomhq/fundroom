# Override: keep documents in an external S3-compatible bucket (AWS S3, Cloudflare R2, MinIO,
# Garage, or the `objstore` profile's SeaweedFS) instead of the /data volume.
#
#   docker compose -f compose.yaml -f compose.s3.yaml up -d
#
# Set S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY and S3_REGION or S3_ENDPOINT in .env.
# The /data volume stays for the generated master key and the setup token.

x-s3-env: &s3-env
  STORAGE_DRIVER: s3
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  migrate:
    environment:
      <<: *s3-env
  app:
    environment:
      <<: *s3-env
  worker:
    environment:
      <<: *s3-env
