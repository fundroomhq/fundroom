# GENERATED by scripts/render-deploy-templates.mjs from deploy/platforms/source.mjs.
# Do not edit: change the source and run `pnpm gen:deploy` (CI runs `pnpm gen:deploy:check`).
#
# Coolify stack that keeps Caddy as the edge for on-demand TLS on customer domains
# (CUSTOM_DOMAIN_DRIVER=caddy-ask). Caddy binds 80/443, so Coolify's proxy must be stopped
# on this server, and the stack must be deployed from the Git repository so that
# ../caddy/Caddyfile resolves (deploy/coolify/README.md).
# One all-in-one process (embedded worker) and a volume: STORAGE_DRIVER=fs.

services:
  db:
    image: "postgres:18-alpine"
    restart: unless-stopped
    environment:
      - "POSTGRES_USER=seedhost"
      - "POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}"
      - "POSTGRES_DB=seedhost"
      - "POSTGRES_INITDB_ARGS=--data-checksums"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedhost -d seedhost"]
      interval: "5s"
      timeout: "3s"
      retries: 20
    security_opt:
      - "no-new-privileges:true"
  migrate:
    image: "ghcr.io/fundroomhq/fundroom:latest"
    restart: "no"
    command: ["migrate"]
    exclude_from_hc: true
    environment:
      - "APP_ENV=prod"
      - "BASE_URL=https://${FUNDROOM_DOMAIN:?}"
      - "DATABASE_URL=postgres://seedhost:${SERVICE_PASSWORD_POSTGRES}@db:5432/seedhost"
      - "ROLES=api,web,worker"
      - "WORKER_MODE=embedded"
      - "MIGRATE_ON_START=false"
      - "TRUST_PROXY=true"
      - "TENANCY_MODE=single"
      - "CUSTOM_DOMAIN_DRIVER=caddy-ask"
      - "ROBOTS=noindex"
      - "LOG_LEVEL=info"
      - "FUNDROOM_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SEEDHOST_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}"
      - "SETUP_TOKEN=${SERVICE_HEX_32_SETUP}"
      - "METRICS_TOKEN=${SERVICE_PASSWORD_METRICS}"
      - "STORAGE_DRIVER=fs"
      - "AV_ACCEPT_UNSCANNED=true"
      - "MAILER_DRIVER=smtp"
      - "SMTP_URL=${SMTP_URL:?}"
      - "MAIL_FROM=${MAIL_FROM:?}"
    read_only: true
    tmpfs:
      - "/tmp:size=256m"
    volumes:
      - "data:/data"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
  app:
    image: "ghcr.io/fundroomhq/fundroom:latest"
    restart: unless-stopped
    command: ["serve"]
    environment:
      - "APP_ENV=prod"
      - "BASE_URL=https://${FUNDROOM_DOMAIN:?}"
      - "DATABASE_URL=postgres://seedhost:${SERVICE_PASSWORD_POSTGRES}@db:5432/seedhost"
      - "ROLES=api,web,worker"
      - "WORKER_MODE=embedded"
      - "MIGRATE_ON_START=false"
      - "TRUST_PROXY=true"
      - "TENANCY_MODE=single"
      - "CUSTOM_DOMAIN_DRIVER=caddy-ask"
      - "ROBOTS=noindex"
      - "LOG_LEVEL=info"
      - "FUNDROOM_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SEEDHOST_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}"
      - "SETUP_TOKEN=${SERVICE_HEX_32_SETUP}"
      - "METRICS_TOKEN=${SERVICE_PASSWORD_METRICS}"
      - "STORAGE_DRIVER=fs"
      - "AV_ACCEPT_UNSCANNED=true"
      - "MAILER_DRIVER=smtp"
      - "SMTP_URL=${SMTP_URL:?}"
      - "MAIL_FROM=${MAIL_FROM:?}"
    read_only: true
    tmpfs:
      - "/tmp:size=256m"
    volumes:
      - "data:/data"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/healthcheck.js"]
      interval: "15s"
      timeout: "5s"
      start_period: "40s"
      retries: 3
  caddy:
    image: "caddy:2-alpine"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - "FUNDROOM_DOMAIN=${FUNDROOM_DOMAIN:?}"
      - "ACME_EMAIL=${ACME_EMAIL:-}"
    volumes:
      - "../caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"

volumes:
  pgdata: {}
  data: {}
  caddy_data: {}
  caddy_config: {}
