# GENERATED by scripts/render-deploy-templates.mjs from deploy/platforms/source.mjs.
# Do not edit: change the source and run `pnpm gen:deploy` (CI runs `pnpm gen:deploy:check`).
#
# Coolify stack behind Coolify's own proxy (Traefik), which routes the app's domain
# (SERVICE_URL_APP_3000) and issues its certificate. BEFORE THE FIRST DEPLOY: give the app
# an https:// domain in Coolify and set BASE_URL to exactly that URL — APP_ENV=prod refuses
# an http BASE_URL, so an http sslip.io default never starts. Custom domains:
# CUSTOM_DOMAIN_DRIVER=manual — add each verified customer domain to the app in Coolify.
# One all-in-one process (embedded worker) and a volume: STORAGE_DRIVER=fs.

services:
  db:
    image: "postgres:18-alpine"
    restart: unless-stopped
    environment:
      - "POSTGRES_USER=seedhost"
      - "POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}"
      - "POSTGRES_DB=seedhost"
      - "POSTGRES_INITDB_ARGS=--data-checksums"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedhost -d seedhost"]
      interval: "5s"
      timeout: "3s"
      retries: 20
    security_opt:
      - "no-new-privileges:true"
  migrate:
    image: "ghcr.io/fundroomhq/fundroom:latest"
    restart: "no"
    command: ["migrate"]
    exclude_from_hc: true
    environment:
      - "APP_ENV=prod"
      - "BASE_URL=${BASE_URL:?}"
      - "DATABASE_URL=postgres://seedhost:${SERVICE_PASSWORD_POSTGRES}@db:5432/seedhost"
      - "ROLES=api,web,worker"
      - "WORKER_MODE=embedded"
      - "MIGRATE_ON_START=false"
      - "TRUST_PROXY=true"
      - "TENANCY_MODE=single"
      - "CUSTOM_DOMAIN_DRIVER=manual"
      - "ROBOTS=noindex"
      - "LOG_LEVEL=info"
      - "FUNDROOM_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SEEDHOST_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}"
      - "SETUP_TOKEN=${SERVICE_HEX_32_SETUP}"
      - "METRICS_TOKEN=${SERVICE_PASSWORD_METRICS}"
      - "STORAGE_DRIVER=fs"
      - "AV_ACCEPT_UNSCANNED=true"
      - "MAILER_DRIVER=smtp"
      - "SMTP_URL=${SMTP_URL:?}"
      - "MAIL_FROM=${MAIL_FROM:?}"
    read_only: true
    tmpfs:
      - "/tmp:size=256m"
    volumes:
      - "data:/data"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
  app:
    image: "ghcr.io/fundroomhq/fundroom:latest"
    restart: unless-stopped
    command: ["serve"]
    environment:
      - SERVICE_URL_APP_3000
      - "APP_ENV=prod"
      - "BASE_URL=${BASE_URL:?}"
      - "DATABASE_URL=postgres://seedhost:${SERVICE_PASSWORD_POSTGRES}@db:5432/seedhost"
      - "ROLES=api,web,worker"
      - "WORKER_MODE=embedded"
      - "MIGRATE_ON_START=false"
      - "TRUST_PROXY=true"
      - "TENANCY_MODE=single"
      - "CUSTOM_DOMAIN_DRIVER=manual"
      - "ROBOTS=noindex"
      - "LOG_LEVEL=info"
      - "FUNDROOM_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SEEDHOST_SECRET_KEY=${SERVICE_REALBASE64_SEEDHOSTKEY}"
      - "SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}"
      - "SETUP_TOKEN=${SERVICE_HEX_32_SETUP}"
      - "METRICS_TOKEN=${SERVICE_PASSWORD_METRICS}"
      - "STORAGE_DRIVER=fs"
      - "AV_ACCEPT_UNSCANNED=true"
      - "MAILER_DRIVER=smtp"
      - "SMTP_URL=${SMTP_URL:?}"
      - "MAIL_FROM=${MAIL_FROM:?}"
    read_only: true
    tmpfs:
      - "/tmp:size=256m"
    volumes:
      - "data:/data"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/healthcheck.js"]
      interval: "15s"
      timeout: "5s"
      start_period: "40s"
      retries: 3

volumes:
  pgdata: {}
  data: {}
