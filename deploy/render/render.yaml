    name: fundroom
    runtime: image
    image:
      url: "ghcr.io/fundroomhq/fundroom:latest"
    plan: starter
    preDeployCommand: "/nodejs/bin/node --import /app/dist/instrumentation.js /app/dist/cli.js migrate"
    healthCheckPath: /readyz
    envVars:
      - fromGroup: fundroom-shared
      # BASE_URL: Public https URL of the portal (the platform hostname or your own domain). e.g. https://investors.example.com
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fundroom-db
          property: connectionString
      - key: ROLES
        value: "api,web"
      - key: WORKER_MODE
        value: external
      - key: SETUP_TOKEN
        generateValue: true
      # S3_BUCKET: Bucket for documents. e.g. fundroom-documents
      - key: S3_BUCKET
        sync: false
      # S3_ENDPOINT: S3 API endpoint (R2, Tigris, B2, AWS: https://s3.<region>.amazonaws.com). e.g. https://<account>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      # S3_ACCESS_KEY_ID: Bucket access key.
      - key: S3_ACCESS_KEY_ID
        sync: false
      # S3_SECRET_ACCESS_KEY: Bucket secret key.
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # SMTP_URL: smtps://user:pass@host:465, or smtp://…:587?requireTLS=true (required in prod; plain STARTTLS is refused). e.g. smtps://user:pass@smtp.example.com:465
