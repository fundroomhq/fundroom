envVarGroups:
  - name: fundroom-shared
    envVars:
      - key: APP_ENV
        value: prod
      - key: MIGRATE_ON_START
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: True-Client-IP
      - key: TENANCY_MODE
        value: single
      - key: CUSTOM_DOMAIN_DRIVER
        value: manual
      - key: ROBOTS
        value: noindex
      - key: LOG_LEVEL
        value: info
      # SEEDHOST_SECRET_KEY is FUNDROOM_SECRET_KEY's pre-rename name, kept here for one minor release: Render generates one value per name, so a FUNDROOM_SECRET_KEY entry would be a second, different key. The app reads SEEDHOST_SECRET_KEY (doctor warns). Never add FUNDROOM_SECRET_KEY with another value (deploy/render/README.md).
      - key: SEEDHOST_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: AV_ACCEPT_UNSCANNED
        value: "true"
      - key: MAILER_DRIVER
        value: smtp

databases:
  - name: fundroom-db
    plan: basic-1gb
    databaseName: seedhost
    user: seedhost
    postgresMajorVersion: "18"
    ipAllowList: []

services:
