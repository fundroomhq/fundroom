{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fundroom.prefix" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fundroom.componentLabels" (list . "worker") | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "fundroom.componentSelectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundroom.componentSelectorLabels" (list . "worker") | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "fundroom.checksums" . | nindent 8 }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fundroom.serviceAccountName" . }}
      {{- include "fundroom.podCommon" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.worker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: worker
          {{- include "fundroom.containerCommon" (dict "root" . "hook" false) | nindent 10 }}
          args: ["serve"]
          env:
            # A dedicated worker: ROLES=worker and no WORKER_MODE (config rejects
            # ROLES=worker with WORKER_MODE=external).
            - name: ROLES
              value: "worker"
            - name: MIGRATE_ON_START
              value: "false"
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            {{- if include "fundroom.migrateOnStart" . }}
            - name: DATABASE_WAIT_TIMEOUT_MS
              value: "300000"
            {{- end }}
            {{- with (include "fundroom.databaseEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The worker still listens (health and /metrics) but gets no Service and no readiness
          # probe: nothing routes requests to it.
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ include "fundroom.path" (dict "root" . "path" "/healthz") }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 72
          livenessProbe:
            httpGet:
              path: {{ include "fundroom.path" (dict "root" . "path" "/healthz") }}
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "fundroom.volumes" (dict "root" . "hook" false) | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
