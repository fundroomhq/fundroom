{{- if .Values.server.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fundroom.prefix" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fundroom.componentLabels" (list . "server") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.server.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "fundroom.componentSelectorLabels" (list . "server") | nindent 6 }}
{{- end }}
