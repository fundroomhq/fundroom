apiVersion: v1
kind: Service
metadata:
  name: {{ include "fundroom.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fundroom.componentLabels" (list . "server") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fundroom.componentSelectorLabels" (list . "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
