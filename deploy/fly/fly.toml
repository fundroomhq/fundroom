# secret: MAIL_FROM — Sender address (required in prod). e.g. investors@example.com

app = "fundroom"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
image = "ghcr.io/fundroomhq/fundroom:latest"

[deploy]
release_command = "migrate"
strategy = "rolling"

[env]
APP_ENV = "prod"
MIGRATE_ON_START = "false"
TRUST_PROXY = "true"
CLIENT_IP_HEADER = "Fly-Client-IP"
TENANCY_MODE = "single"
CUSTOM_DOMAIN_DRIVER = "manual"
ROBOTS = "noindex"
LOG_LEVEL = "info"
STORAGE_DRIVER = "s3"
S3_ENDPOINT = "https://fly.storage.tigris.dev"
S3_REGION = "auto"
AV_ACCEPT_UNSCANNED = "true"
MAILER_DRIVER = "smtp"

[processes]
app = "serve --roles api,web"
worker = "serve --roles worker"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "30s"
interval = "15s"
method = "GET"
path = "/readyz"
timeout = "5s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
processes = ["app"]

[[vm]]
size = "shared-cpu-2x"
memory = "1gb"
processes = ["worker"]
