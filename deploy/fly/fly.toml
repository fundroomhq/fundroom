#
# Set with `fly secrets set` (deploy/fly/README.md), never in this file:
# secret: BASE_URL — Public https URL of the portal (the platform hostname or your own domain). e.g. https://investors.example.com
# secret: DATABASE_URL — set by `fly mpg attach`
# secret: FUNDROOM_SECRET_KEY — `openssl rand -base64 32`
#   (was SEEDHOST_SECRET_KEY: an existing app keeps working on the old name. Upgrade the image
#   first, then set the new name to the SAME value; an older image reads only the old
