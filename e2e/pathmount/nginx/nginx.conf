# nginx.test — the customer's site, with the nginx recipe included verbatim.
#
# Harness wrapping only: in production this `server` block would also `listen 443 ssl` with the
# site's own certificate. Here the edge terminates TLS in front of it (e2e/pathmount/edge/Caddyfile)
# and `/etc/ssl/certs/ca-certificates.crt` is the edge's internal root, so the recipe's
# `proxy_ssl_verify on` verifies the portal's certificate for real.
server {
    listen 80;
    server_name nginx.test;

    # The recipe under test, byte for byte what the docs publish.
    include /etc/nginx/seed-host-mount.conf;

    # The marketing page. It sets a cookie on Path=/ so the spec can see what the recipe forwards.
    location = / {
        add_header Set-Cookie "host_session=nginx-secret; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><title>Acme (nginx)</title><h1>Acme, served by nginx</h1><p><a href="/investors/">Investor portal</a></p></html>';
    }

    location / {
        return 404;
    }
}
