# nginx serves `e2e/hosts/` exactly as it is on disk — the pages, their scripts and this file.
# There is no build step and no templating on purpose: a host page in this harness has to be the
# same static HTML a customer pastes into a CMS, hostnames and slug included.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index plain.html;

    # The pages change between runs and the browser keeps its cache across them, so a stale page
    # would show up as a baffling assertion failure three tests later.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
